name: Generate Snake

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: swiftalker
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Check generated files
        run: |
          echo "Generated files:"
          find dist -type f -maxdepth 2 -print
          ls -lah dist

      - name: Publish to output branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git clone --branch output \
            https://x-access-token:${GITHUB_TOKEN}@github.com/swiftalker/swiftalker.git output-repo \
            || git clone \
            https://x-access-token:${GITHUB_TOKEN}@github.com/swiftalker/swiftalker.git output-repo

          cd output-repo

          git checkout --orphan output
          git rm -rf . 2>/dev/null || true

          cp ../dist/* .

          git add .
          git commit -m "Update GitHub contribution snake" || true
          git push origin output --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
